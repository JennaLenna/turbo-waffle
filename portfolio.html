<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Jenna Lenna | Portfolio</title>
	<link rel="stylesheet" href="styles.css">
</head>
<body>
	<header class="site-header">
		<div class="header-inner">
			<div class="site-title">Jenna Lenna</div>
			<button class="menu-toggle" aria-label="Open navigation" aria-expanded="false" aria-controls="nav-drawer">☰</button>
		</div>
	</header>

	<nav id="nav-drawer" class="nav-drawer" aria-hidden="true">
		<div class="nav-drawer__header">
			<span class="nav-drawer__title">Menu</span>
			<button class="menu-close" aria-label="Close navigation">×</button>
		</div>
		<a class="nav-link" href="index.html">Home</a>
		<a class="nav-link" href="portfolio.html">Portfolio</a>
		<a class="nav-link" href="about%20me.html">About Me</a>
		<a class="nav-link" href="author.html">I write books</a>
	</nav>
	<div class="nav-overlay" hidden></div>

	<main class="content">
		<section class="hero">
			<h1 class="page-heading">Portfolio</h1>

		</section>

		<section class="portfolio-categories" aria-label="Portfolio categories">
			<a class="portfolio-cat-card" href="portfolio-standard.html">
				<div class="fan-container" aria-hidden="true">
					<img decoding="async" loading="lazy" class="fan-img" src="art%20for%20portfolio/previews/OC%20art%20%281%29.jpg" alt="">
					<img decoding="async" loading="lazy" class="fan-img" src="art%20for%20portfolio/previews/DJ.jpg" alt="">
					<img decoding="async" loading="lazy" class="fan-img" src="art%20for%20portfolio/previews/bubble.jpg" alt="">
					<img decoding="async" loading="lazy" class="fan-img" src="art%20for%20portfolio/previews/camilla.jpg" alt="">
				</div>
				<h2 class="portfolio-cat-title">Standard Art</h2>
			</a>

			<a class="portfolio-cat-card" href="portfolio-lineart.html">
				<div class="fan-container" aria-hidden="true">
					<img decoding="async" loading="lazy" class="fan-img" src="art%20for%20portfolio/previews/procreate%20sketch.jpg" alt="">
					<img decoding="async" loading="lazy" class="fan-img" src="art%20for%20portfolio/previews/rough%20sketch.jpg" alt="">
					<img decoding="async" loading="lazy" class="fan-img" src="art%20for%20portfolio/previews/just%20a%20lil%20rough%20sketch.jpg" alt="">
				</div>
				<h2 class="portfolio-cat-title">Lineart Pieces</h2>
			</a>

			<a class="portfolio-cat-card" href="portfolio-extra.html">
				<div class="fan-container" aria-hidden="true">
					<img decoding="async" loading="lazy" class="fan-img" src="art%20for%20portfolio/previews/new%20drawing.jpg" alt="">
					<img decoding="async" loading="lazy" class="fan-img" src="art%20for%20portfolio/previews/first%20realistic%20drawing%20I%E2%80%99ve%20done%20%F0%9F%92%96.jpg" alt="">
				</div>
				<h2 class="portfolio-cat-title">Extra Pieces</h2>
			</a>

			<a class="portfolio-cat-card" href="portfolio-comic.html">
				<div class="fan-container" aria-hidden="true">
					<img decoding="async" loading="lazy" class="fan-img" src="art%20for%20portfolio/previews/comic1.jpg" alt="">
					<img decoding="async" loading="lazy" class="fan-img" src="art%20for%20portfolio/previews/comic2.jpg" alt="">
					<img decoding="async" loading="lazy" class="fan-img" src="art%20for%20portfolio/previews/comic3.jpg" alt="">
					<img decoding="async" loading="lazy" class="fan-img" src="art%20for%20portfolio/previews/comic4.jpg" alt="">
				</div>
				<h2 class="portfolio-cat-title">Comic Panels</h2>
			</a>
		</section>
	</main>

	<script>
		const drawer = document.getElementById('nav-drawer');
		const toggle = document.querySelector('.menu-toggle');
		const closeBtn = document.querySelector('.menu-close');
		const overlay = document.querySelector('.nav-overlay');

		const openDrawer = () => {
			drawer.classList.add('open');
			overlay.hidden = false;
			toggle.setAttribute('aria-expanded', 'true');
			drawer.setAttribute('aria-hidden', 'false');
		};

		const closeDrawer = () => {
			drawer.classList.remove('open');
			overlay.hidden = true;
			toggle.setAttribute('aria-expanded', 'false');
			drawer.setAttribute('aria-hidden', 'true');
		};

		toggle.addEventListener('click', openDrawer);
		closeBtn.addEventListener('click', closeDrawer);
		overlay.addEventListener('click', closeDrawer);
		drawer.querySelectorAll('a').forEach(link => link.addEventListener('click', closeDrawer));
	</script>
</body>
</html>
